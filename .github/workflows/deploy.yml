name: Deploy FAK Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Auf EC2 deployen
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/frauen-aufklaerung-website
            git pull origin main

            docker cp index.html frauen-website:/usr/share/nginx/html/
            docker cp admin.html frauen-website:/usr/share/nginx/html/
            docker cp magazin.html frauen-website:/usr/share/nginx/html/
            docker cp redaktion.html frauen-website:/usr/share/nginx/html/
            docker cp arbeitsplan.html frauen-website:/usr/share/nginx/html/
            docker cp docs/FAK_Redaktion_Arbeitsplan_Vorlage.docx frauen-website:/usr/share/nginx/html/arbeitsplan_vorlage.docx
            docker exec frauen-website nginx -s reload

            docker stop translation-api || true
            docker rm translation-api || true
            docker run -d --name translation-api --restart always -p 8001:8000 -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} aske84/translation-api:latest

            echo "Deploy erfolgreich: $(date)"
