name: Deploy FAK Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Auf EC2 deployen
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/frauen-aufklaerung-website
            git pull origin main
            docker cp redaktion.html frauen-website:/usr/share/nginx/html/redaktion.html
            docker cp admin.html frauen-website:/usr/share/nginx/html/admin.html
            docker cp index.html frauen-website:/usr/share/nginx/html/index.html
            docker cp magazin.html frauen-website:/usr/share/nginx/html/magazin.html
            docker exec frauen-website nginx -s reload
            echo "Deploy erfolgreich: $(date)"
